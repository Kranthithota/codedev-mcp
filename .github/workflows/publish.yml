name: Publish to npm

on:
  release:
    types: [created]
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history to detect version changes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Check if version changed
        id: version_check
        run: |
          # For tag pushes (v*), releases, or manual dispatch, always publish
          if [[ "${{ github.event_name }}" == "release" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "Publishing: ${{ github.event_name }} event"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            # For main branch pushes, check if package.json version changed
            if git diff HEAD~1 HEAD -- package.json > /dev/null 2>&1; then
              OLD_VERSION=$(git show HEAD~1:package.json 2>/dev/null | grep -o '"version": "[^"]*"' | cut -d'"' -f4 || echo "")
              NEW_VERSION=$(grep -o '"version": "[^"]*"' package.json | cut -d'"' -f4)
              if [ "$OLD_VERSION" != "$NEW_VERSION" ] && [ -n "$NEW_VERSION" ]; then
                echo "should_publish=true" >> $GITHUB_OUTPUT
                echo "Version changed from $OLD_VERSION to $NEW_VERSION - publishing"
              else
                echo "should_publish=false" >> $GITHUB_OUTPUT
                echo "No version change detected (old: $OLD_VERSION, new: $NEW_VERSION)"
              fi
            else
              echo "should_publish=false" >> $GITHUB_OUTPUT
              echo "package.json not modified in this commit"
            fi
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "Not a publish trigger event"
          fi
      - name: Publish to npm
        if: steps.version_check.outputs.should_publish == 'true'
        run: |
          npm ci
          npm run build
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
